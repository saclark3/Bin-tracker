name: BinTracker
options:
  bundleIdPrefix: com.saclark3
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"
settings:
  base:
    # Shared by the iPhone app and the watch app (Apple requires the two to match).
    # CI overrides CURRENT_PROJECT_VERSION with the build number.
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SLTV9MC3Y7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  BinTracker:
    type: application
    platform: iOS
    sources: [BinTracker, Shared]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      # The watch app ships inside the iPhone app ("Embed Watch Content").
      - target: BinTrackerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saclark3.bintracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bins
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
  BinTrackerWatch:
    type: application
    platform: watchOS
    sources: [BinTrackerWatch, Shared]
    info:
      path: BinTrackerWatch/Info.plist
      properties:
        WKApplication: true
    settings:
      base:
        PRODUCT_NAME: BinsWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.saclark3.bintracker.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bins
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.saclark3.bintracker
        # Installed from the iPhone; gets its data from the iPhone app.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
